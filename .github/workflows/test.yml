name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  usage:
    # Offline: no sign-in, no daemon, no model tokens.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/usage.mjs
      - run: node --check mcp/connect-mcp.mjs && node --check bin/connect.mjs

  plugin:
    # The function-hooks API is early access, so this tracks the latest Claude
    # Code on purpose: a break here is the first sign the HUD needs updating.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test .
